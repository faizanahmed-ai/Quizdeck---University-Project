<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuizDeck — Bet on Yourself</title>

<style>
/* ── CSS Variables (design tokens) ── */
:root{--o:#FF6B00;--od:#CC5500;--ol:#FFF0E5;--y:#FFD000;--yl:#FFF5CC;--yd:#B89200;--r:#E8002D;--rl:#FFE5EB;--g:#00B341;--gl:#E5F7EC;--b:#005FBF;--bl:#E5F0FF;--w:#fff;--off:#FFF8F3;--g1:#F0F1F3;--g2:#E2E4E8;--g4:#9BA0AB;--g6:#5C6370;--g8:#1F2329;--sm:0 2px 8px #0000001a;--md:0 4px 20px #0000001f;--lg:0 8px 40px #00000029;--so:0 6px 24px #ff6b0059;--sy:0 6px 24px #ffd00066;--rad:20px;--rsm:12px;--rxs:8px;--cw:min(440px,94vw);--ff:'Fredoka One',cursive;--fm:'JetBrains Mono',monospace;--fn:'Nunito',sans-serif;--ease:cubic-bezier(.34,1.56,.64,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--off);color:var(--g8);font-family:var(--fn);min-height:100vh;overflow-x:hidden;cursor:none}
#cursor{position:fixed;width:12px;height:12px;background:var(--o);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s;mix-blend-mode:multiply}
#cursor-ring{position:fixed;width:36px;height:36px;border:2px solid var(--o);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s;opacity:.6}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 10% 20%,#ffd00026 0%,transparent 50%),radial-gradient(circle at 90% 80%,#ff6b001f 0%,transparent 50%);animation:bgShift 8s ease-in-out infinite alternate}
@keyframes bgShift{0%{opacity:.8}100%{opacity:1}}
.floater{position:fixed;pointer-events:none;z-index:0;font-size:clamp(18px,3vw,32px);animation:floatAround linear infinite;opacity:.1;will-change:transform}
@keyframes floatAround{0%{transform:translateY(100vh) rotate(0deg)}100%{transform:translateY(-120px) rotate(720deg)}}
.screen{display:none;min-height:100vh;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}
.screen-enter{animation:screenIn .4s var(--ease) both}
@keyframes screenIn{0%{opacity:0;transform:scale(.94) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
#home{align-items:center;justify-content:flex-start;padding:0}
.home-hero{width:100%;background:linear-gradient(135deg,var(--o),#FF4500);padding:44px 24px 76px;text-align:center;position:relative;overflow:hidden;background-size:200% 200%;animation:heroGrad 4s ease infinite}
@keyframes heroGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.home-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:250px;height:250px;background:#ffffff14;border-radius:50%;animation:heroBubble1 6s ease-in-out infinite}
.home-hero::after{content:'';position:absolute;bottom:-80px;left:-30px;width:200px;height:200px;background:#ffd00026;border-radius:50%;animation:heroBubble2 5s ease-in-out infinite}
@keyframes heroBubble1{0%,100%{transform:scale(1)}50%{transform:scale(1.15) translate(10px,-15px)}}
@keyframes heroBubble2{0%,100%{transform:scale(1)}50%{transform:scale(1.2) translate(-10px,10px)}}
.logo-badge{display:inline-block;background:var(--y);color:var(--od);font-family:var(--ff);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:6px 16px;border-radius:50px;margin-bottom:16px;animation:badgePop .5s var(--ease) both,badgeBounce 3s ease-in-out 1s infinite}
@keyframes badgePop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes badgeBounce{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.05) rotate(1deg)}}
.logo-mark{font-family:var(--ff);font-size:clamp(52px,11vw,90px);color:#fff;letter-spacing:2px;line-height:1;text-shadow:4px 6px 0 #0000003d;animation:logoSlide .6s var(--ease) .1s both;display:inline-block;transition:transform .2s}
.logo-mark:hover{transform:scale(1.04) rotate(-1deg)}
@keyframes logoSlide{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
.logo-tagline{font-size:14px;color:#ffffffd9;font-weight:700;margin-top:8px;letter-spacing:.5px;animation:fadeUp .7s .3s both}
.version-tag{display:inline-block;background:#ffffff33;color:#fff;font-family:var(--fm);font-size:9px;padding:2px 8px;border-radius:50px;margin-top:6px;letter-spacing:2px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.home-content{width:100%;max-width:900px;margin:0 auto;padding:0 20px 40px;transform:translateY(-28px)}
.daily-card{background:linear-gradient(135deg,var(--y),#FFB300);border-radius:var(--rad);padding:20px 24px;display:flex;align-items:center;gap:16px;transition:all .3s var(--ease);box-shadow:var(--sy);margin-bottom:24px;border:3px solid #ffffff80;position:relative;overflow:hidden}
.daily-card::after{content:'';position:absolute;top:0;right:0;bottom:0;width:80px;background:#ffffff2e;transform:skewX(-15deg) translateX(20px);transition:width .3s}
.daily-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 48px #ffd0008c}
.daily-card:hover::after{width:120px}
.daily-icon{font-size:40px;flex-shrink:0;animation:wobble 2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.daily-text h3{font-family:var(--ff);font-size:22px;color:var(--od)}
.daily-text p{font-size:13px;color:var(--od);opacity:.8;font-weight:700}
.daily-arrow{margin-left:auto;background:#fff;color:var(--o);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0;transition:transform .3s var(--ease)}
.daily-card:hover .daily-arrow{transform:translateX(5px) scale(1.15)}
.section-label{font-family:var(--ff);font-size:18px;color:var(--g6);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:2px;background:var(--g2);border-radius:2px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.topic-card{background:#fff;border:2.5px solid var(--g2);border-radius:var(--rad);padding:20px 16px;transition:all .3s var(--ease);position:relative;overflow:hidden;box-shadow:var(--sm)}
.topic-card::before{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;background:var(--cb,var(--g1));border-radius:50%;transition:all .4s var(--ease)}
.topic-card:hover{border-color:var(--cc);transform:translateY(-8px) scale(1.02);box-shadow:var(--cs)}
.topic-card:hover::before{width:220px;height:220px;bottom:-60px;right:-60px}
.topic-card[data-topic="gk"]     {--cc:var(--o);--cs:var(--so);--cb:var(--ol)}
.topic-card[data-topic="history"]{--cc:var(--r);--cs:0 6px 24px #e8002d4d;--cb:var(--rl)}
.topic-card[data-topic="sports"] {--cc:#008C8C;--cs:0 6px 24px #008c8c4d;--cb:#E5F5F5}
.topic-card[data-topic="science"]{--cc:var(--b);--cs:0 6px 24px #005fbf4d;--cb:var(--bl)}
.topic-card[data-topic="campus"] {--cc:var(--y);--cs:var(--sy);--cb:var(--yl)}
.topic-icon{font-size:34px;display:block;margin-bottom:8px;transition:transform .3s var(--ease)}
.topic-card:hover .topic-icon{transform:scale(1.25) rotate(8deg)}
.topic-count{position:absolute;top:12px;right:12px;background:var(--g1);color:var(--g6);font-family:var(--fm);font-size:9px;font-weight:700;padding:2px 7px;border-radius:50px}
.topic-name{font-family:var(--ff);font-size:16px;color:var(--g8);margin-bottom:2px;transition:color .2s}
.topic-card:hover .topic-name{color:var(--cc)}
.topic-desc{font-size:11px;color:var(--g4);font-weight:700}
.home-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-ghost{background:#fff;border:2px solid var(--g2);border-radius:var(--rsm);padding:10px 20px;color:var(--g6);font-family:var(--fn);font-weight:800;font-size:13px;transition:all .25s var(--ease);box-shadow:var(--sm);position:relative;overflow:hidden}
.btn-ghost:hover{border-color:var(--o);color:var(--o);transform:translateY(-3px) scale(1.04);box-shadow:var(--so)}
/* ── Shared primary button + submit (shimmer via ::before) ── */
.btn-primary,.submit-btn,.custom-start{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--o),var(--od));border:none;border-radius:var(--rsm);color:#fff;font-family:var(--ff);transition:all .25s var(--ease);box-shadow:0 4px 0 var(--od),var(--so)}
.btn-primary,.custom-start{padding:12px 24px;font-size:16px}
.submit-btn{width:100%;max-width:var(--cw);padding:14px;font-size:18px;letter-spacing:1px}
.btn-primary::before,.submit-btn::before,.custom-start::before{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:#ffffff40;transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%{left:-60%}100%{left:150%}}
.btn-primary:hover,.custom-start:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--od),var(--so)}
.btn-primary:active,.custom-start:active{transform:translateY(2px);box-shadow:0 2px 0 var(--od)}
.submit-btn:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 8px 0 var(--od),var(--so)}
.submit-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--od)}
.submit-btn:disabled{background:var(--g2);color:var(--g4);box-shadow:0 4px 0 var(--g2)}
.submit-btn:disabled::before{display:none}
#mode-select{align-items:center;justify-content:center;padding:40px 20px}
.mode-header{text-align:center;margin-bottom:28px;animation:fadeUp .5s both}
.mode-header h2{font-family:var(--ff);font-size:clamp(30px,6vw,52px);color:var(--g8)}
.mode-header p{font-size:14px;color:var(--g4);font-weight:700;margin-top:6px}
.modes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:640px;width:100%}
.mode-card{background:#fff;border:2.5px solid var(--g2);border-radius:var(--rad);padding:20px 16px;transition:all .3s var(--ease);text-align:center;position:relative;box-shadow:var(--sm);overflow:hidden}
.mode-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--mc,var(--g1)) 0%,transparent 70%);opacity:0;transition:opacity .3s}
.mode-card:hover{border-color:var(--mc);transform:translateY(-8px) scale(1.03);box-shadow:var(--ms)}
.mode-card:hover::before{opacity:.14}
.mode-card[data-mode="classic"]{--mc:var(--g);--ms:0 8px 30px #00b3414d}
.mode-card[data-mode="custom"] {--mc:var(--y);--ms:var(--sy)}
.mode-card[data-mode="2player"]{--mc:#3F51B5;--ms:0 8px 30px #3f51b54d}
.mode-tag{position:absolute;top:10px;right:10px;background:var(--mc);color:#fff;font-family:var(--fm);font-size:7px;font-weight:700;padding:2px 7px;border-radius:50px;letter-spacing:1px}
.mode-icon{font-size:34px;display:block;margin-bottom:8px;transition:transform .3s var(--ease)}
.mode-card:hover .mode-icon{transform:scale(1.3) rotate(-5deg)}
.mode-name{font-family:var(--ff);font-size:18px;color:var(--mc);margin-bottom:4px}
.mode-desc{font-size:11px;color:var(--g4);font-weight:700;line-height:1.4}
.back-btn{position:absolute;top:20px;left:20px;background:#fff;border:2px solid var(--g2);border-radius:var(--rsm);padding:9px 16px;color:var(--g6);font-family:var(--fn);font-weight:800;font-size:12px;transition:all .25s var(--ease);box-shadow:var(--sm);z-index:10}
.back-btn:hover{border-color:var(--o);color:var(--o);transform:translateX(-5px)}
#custom-modal{position:fixed;inset:0;z-index:800;display:none;align-items:center;justify-content:center;padding:20px;background:#0000006b;backdrop-filter:blur(8px)}
#custom-modal.active{display:flex}
.custom-box{background:#fff;border-radius:var(--rad);padding:32px;width:min(420px,95vw);box-shadow:var(--lg);animation:modalIn .4s var(--ease) both}
@keyframes modalIn{0%{transform:scale(.8) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.custom-box h3{font-family:var(--ff);font-size:28px;color:var(--g8);margin-bottom:20px;text-align:center}
.custom-row{margin-bottom:18px}
.custom-row label{display:block;font-weight:800;font-size:13px;color:var(--g6);margin-bottom:8px;letter-spacing:.5px}
.custom-slider{width:100%;accent-color:var(--o);height:6px}
.custom-val{font-family:var(--ff);font-size:22px;color:var(--o);text-align:center;margin-top:4px}
.speed-btns{display:flex;gap:8px}
.speed-btn{flex:1;background:var(--g1);border:2px solid var(--g2);border-radius:var(--rsm);padding:10px;font-family:var(--ff);font-size:14px;transition:all .2s;text-align:center}
.speed-btn.active,.speed-btn:hover{border-color:var(--o);background:var(--ol);color:var(--od)}
.custom-start{width:100%;font-size:18px;padding:14px;margin-top:8px;box-shadow:0 4px 0 var(--od)}
.custom-start:hover{box-shadow:0 7px 0 var(--od),var(--so)}
.player-turn-banner{background:linear-gradient(135deg,var(--b),#003d8f);border-radius:var(--rsm);padding:10px 20px;text-align:center;margin-bottom:12px;animation:fadeUp .3s both;display:none}
.player-turn-banner.active{display:block}
.player-turn-banner .pname{font-family:var(--ff);font-size:20px;color:#fff}
.player-turn-banner .pnum{font-size:12px;color:#ffffffbf;font-weight:700;letter-spacing:1px}
.p1-score,.p2-score{font-family:var(--ff);font-size:14px;padding:4px 12px;border-radius:50px;display:inline-block}
.p1-score{background:var(--bl);color:var(--b)}
.p2-score{background:var(--rl);color:var(--r)}
#game{align-items:stretch;flex-direction:column}
.game-hud{background:var(--w);border-bottom:3px solid var(--g2);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--sm);flex-wrap:wrap;position:sticky;top:0;z-index:100}
.hud-score-wrap{background:linear-gradient(135deg,var(--o),var(--od));border-radius:var(--rsm);padding:8px 14px;text-align:center;min-width:76px}
.hud-score-wrap.bump{animation:scoreBump .35s var(--ease)}
@keyframes scoreBump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hud-score{font-family:var(--ff);font-size:26px;color:#fff;line-height:1}
.hud-score-label{font-size:9px;color:#ffffffcc;font-weight:800;letter-spacing:2px}
.streak-wrap{background:var(--yl);border:2px solid var(--y);border-radius:var(--rsm);padding:5px 12px;display:flex;align-items:center;gap:5px}
.streak-flame{font-size:16px;filter:grayscale(1);transition:all .3s}
.streak-flame.active{filter:none;animation:flamePop .4s ease}
@keyframes flamePop{0%{transform:scale(1)}50%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(1)}}
.hud-streak{font-family:var(--ff);font-size:15px;color:var(--yd)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hud-mode{background:var(--g1);border-radius:var(--rxs);padding:2px 8px;font-family:var(--fm);font-size:9px;font-weight:700;color:var(--g6);letter-spacing:2px}
.hud-cards{font-size:11px;color:var(--g4);font-weight:700}
.btn-quit{background:var(--rl);border:2px solid #e8002d33;border-radius:var(--rxs);padding:3px 9px;color:var(--r);font-family:var(--fn);font-weight:800;font-size:11px;transition:all .2s}
.btn-quit:hover{background:var(--r);color:#fff;transform:scale(1.05)}
.timer-track{height:5px;background:var(--g1);position:relative;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--g),var(--y) 50%,var(--r));transform-origin:left;transition:transform .1s linear;background-size:300%;animation:timerGrad 2s linear infinite;will-change:transform}
@keyframes timerGrad{0%{background-position:0%}100%{background-position:300%}}
.timer-fill.danger{animation:timerDanger .3s ease infinite,timerGrad 2s linear infinite}
@keyframes timerDanger{0%,100%{opacity:1}50%{opacity:.35}}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:16px;width:100%;max-width:560px;margin:0 auto}
.card-container{width:var(--cw);position:relative}
.quiz-card{width:100%;background:#ffffffe0;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:2px solid #ffffffb3;border-radius:var(--rad);padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--md),0 4px 0 0 var(--g2);animation:cardDeal .45s var(--ease) both;transition:border-color .3s,box-shadow .3s}
@keyframes cardDeal{0%{transform:translateY(-60px) scale(.88) rotate(-3deg);opacity:0}60%{transform:translateY(6px) scale(1.02) rotate(.5deg)}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
.quiz-card.correct-flash{border-color:var(--g)!important;box-shadow:var(--md),0 4px 0 0 var(--g),0 0 0 6px #00b34124!important}
.quiz-card.wrong-flash{animation:wrongShake .5s ease forwards;border-color:var(--r)!important}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.card-header{display:flex;align-items:center;justify-content:space-between}
.rarity-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 9px;border-radius:50px}
.rarity-badge.common  {background:var(--g1);color:var(--g6);border:2px solid var(--g2)}
.rarity-badge.rare    {background:var(--bl);color:var(--b);border:2px solid #005fbf33}
.rarity-badge.legendary{background:linear-gradient(135deg,#FFD000,#FF8C00);color:#fff;animation:legendaryPulse 1.5s ease infinite}
@keyframes legendaryPulse{0%,100%{box-shadow:0 0 0 0 #ffd00099}50%{box-shadow:0 0 0 8px #ffd00000}}
.card-topic-tag{font-family:var(--fm);font-size:8px;font-weight:700;color:var(--g4);letter-spacing:1px;text-transform:uppercase;background:var(--g1);padding:2px 7px;border-radius:50px;border:1px solid var(--g2)}
.card-question{font-family:var(--fn);font-size:clamp(15px,3.2vw,19px);font-weight:800;line-height:1.4;color:var(--g8);min-height:56px;display:flex;align-items:center}
.char-attr{font-size:10px;color:var(--g4);font-style:italic;font-weight:700;background:var(--g1);border-radius:50px;padding:2px 10px;display:inline-block;margin-top:4px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.option-btn{background:#f0f1f3cc;border:2px solid var(--g2);border-radius:var(--rsm);padding:10px 11px;color:var(--g8);font-family:var(--fn);font-size:12px;font-weight:800;text-align:left;transition:all .2s var(--ease);line-height:1.3;position:relative;overflow:hidden}
.option-btn:hover:not(:disabled){border-color:var(--o);background:var(--ol);color:var(--od);transform:scale(1.04) translateY(-2px);box-shadow:var(--so)}
.option-btn.selected-state{border-color:var(--o);background:var(--ol);color:var(--od)}
.option-btn.correct{border-color:var(--g);background:var(--gl);color:var(--g);animation:correctPop .4s var(--ease)}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1.02)}}
.option-btn.wrong{border-color:var(--r);background:var(--rl);color:var(--r)}
.option-letter{font-family:var(--ff);font-size:10px;background:var(--g2);color:var(--g6);width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:5px;flex-shrink:0;transition:all .2s}
.option-btn.correct .option-letter{background:var(--g);color:#fff}
.option-btn.wrong   .option-letter{background:var(--r);color:#fff}
.option-btn.selected-state .option-letter{background:var(--o);color:#fff}
.bet-panel{width:100%;max-width:var(--cw)}
.bet-label{text-align:center;font-family:var(--ff);font-size:14px;color:var(--g6);margin-bottom:8px}
.bet-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bet-btn{background:#fff;border:2px solid var(--g2);border-radius:var(--rsm);padding:10px 6px;text-align:center;transition:all .25s var(--ease);box-shadow:var(--sm);position:relative;overflow:hidden}
.bet-btn:hover{transform:translateY(-5px) scale(1.06);box-shadow:var(--md)}
.bet-btn.selected-1{border-color:var(--g);background:var(--gl);box-shadow:0 4px 16px #00b34140}
.bet-btn.selected-2{border-color:var(--o);background:var(--ol);box-shadow:var(--so)}
.bet-btn.selected-3{border-color:var(--r);background:var(--rl);box-shadow:0 4px 16px #e8002d40}
.bet-stars{font-si
