<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Makes the page responsive on mobile devices -->
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuizDeck — Bet on Yourself</title>

<style>
/* ════════════════════════════════════════════════════════════
   1. CSS VARIABLES — "Design Tokens"
   These are like global constants for the entire stylesheet.
   Instead of repeating color values everywhere, we define
   them once here and reuse them with var(--name).
   If you want to change the orange color of the whole app,
   you only change --o here, and it updates everywhere.
   ════════════════════════════════════════════════════════════ */
:root{
  /* ── COLORS ── */
  --o:#FF6B00;   /* Orange — main brand/primary color */
  --od:#CC5500;  /* Orange Dark — used for shadows and hover states */
  --ol:#FFF0E5;  /* Orange Light — used for backgrounds on hover */

  --y:#FFD000;   /* Yellow — used for daily challenge card */
  --yl:#FFF5CC;  /* Yellow Light */
  --yd:#B89200;  /* Yellow Dark */

  --r:#E8002D;   /* Red — wrong answers, quit button */
  --rl:#FFE5EB;  /* Red Light */

  --g:#00B341;   /* Green — correct answers */
  --gl:#E5F7EC;  /* Green Light */

  --b:#005FBF;   /* Blue — 2-player mode, info */
  --bl:#E5F0FF;  /* Blue Light */

  --w:#fff;      /* White */
  --off:#FFF8F3; /* Off-white — page background */

  /* ── GRAYS (numbered by darkness: g1=lightest, g8=darkest) ── */
  --g1:#F0F1F3;
  --g2:#E2E4E8;
  --g4:#9BA0AB;
  --g6:#5C6370;
  --g8:#1F2329;

  /* ── BOX SHADOWS ── */
  --sm:0 2px 8px #0000001a;   /* Small shadow */
  --md:0 4px 20px #0000001f;  /* Medium shadow */
  --lg:0 8px 40px #00000029;  /* Large shadow */
  --so:0 6px 24px #ff6b0059;  /* Orange-tinted glow shadow */
  --sy:0 6px 24px #ffd00066;  /* Yellow-tinted glow shadow */

  /* ── SHAPE & SPACING ── */
  --rad:20px;   /* Large border-radius (cards) */
  --rsm:12px;   /* Small border-radius (buttons) */
  --rxs:8px;    /* Extra-small border-radius (tags) */
  --cw:min(440px,94vw); /* Card width — max 440px, but never more than 94% of screen */

  /* ── TYPOGRAPHY — Font families ── */
  --ff:'Fredoka One',cursive;     /* Fun/display font — used for headings, scores */
  --fm:'JetBrains Mono',monospace;/* Mono font — used for tags, badges, code-like labels */
  --fn:'Nunito',sans-serif;       /* Body font — used for regular text */

  /* ── EASING CURVE ── */
  /* cubic-bezier creates a "springy" bounce animation feel */
  --ease:cubic-bezier(.34,1.56,.64,1);
}

/* ════════════════════════════════════════════════════════════
   2. GLOBAL RESET
   Removes all default browser margin/padding and makes
   box-sizing consistent — padding doesn't add to element width.
   ════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}

/* ── Page body setup ── */
body{
  background:var(--off);  /* Off-white background */
  color:var(--g8);         /* Dark text by default */
  font-family:var(--fn);   /* Nunito as base font */
  min-height:100vh;        /* At least full screen height */
  overflow-x:hidden;       /* Prevent horizontal scroll */
  cursor:none;             /* Hide the real cursor — we use a custom one below */
}


/* ════════════════════════════════════════════════════════════
   3. CUSTOM CURSOR
   Two elements: a small filled dot (#cursor) and a larger
   ring (#cursor-ring) that follows slightly behind.
   JavaScript (not shown) moves these with mousemove.
   ════════════════════════════════════════════════════════════ */
#cursor{
  position:fixed;          /* Stays in viewport, doesn't scroll */
  width:12px;height:12px;
  background:var(--o);     /* Orange dot */
  border-radius:50%;       /* Makes it a circle */
  pointer-events:none;     /* Invisible to clicks — clicks pass through */
  z-index:9999;            /* Always on top of everything */
  transform:translate(-50%,-50%); /* Centers dot on the actual mouse point */
  transition:width .15s,height .15s; /* Smooth size change on hover states */
  mix-blend-mode:multiply; /* Blends with background colors visually */
}
#cursor-ring{
  position:fixed;
  width:36px;height:36px;
  border:2px solid var(--o); /* Just the outline ring, no fill */
  border-radius:50%;
  pointer-events:none;
  z-index:9998;              /* Just below the dot */
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s;
  opacity:.6;                /* Slightly transparent */
}


/* ════════════════════════════════════════════════════════════
   4. ANIMATED BACKGROUND
   body::before is a "pseudo-element" — a fake element that
   exists purely in CSS without any HTML tag.
   It creates two soft radial gradient blobs on the background
   that slowly pulse (via the bgShift animation).
   ════════════════════════════════════════════════════════════ */
body::before{
  content:'';              /* Required for pseudo-elements to show */
  position:fixed;          /* Covers entire viewport */
  inset:0;                 /* Shorthand for top/right/bottom/left: 0 */
  pointer-events:none;     /* Can't click it */
  z-index:0;               /* Behind all content */
  background:
    radial-gradient(circle at 10% 20%,#ffd00026 0%,transparent 50%), /* Yellow blob top-left */
    radial-gradient(circle at 90% 80%,#ff6b001f 0%,transparent 50%); /* Orange blob bottom-right */
  animation:bgShift 8s ease-in-out infinite alternate; /* Slowly fades between opacity */
}
@keyframes bgShift{
  0%{opacity:.8}
  100%{opacity:1}
}


/* ════════════════════════════════════════════════════════════
   5. FLOATING EMOJI DECORATIONS
   .floater elements (added via JS) drift upward from the
   bottom of the screen like bubbles. Each has a random
   left position, size, and animation duration set by JS.
   ════════════════════════════════════════════════════════════ */
.floater{
  position:fixed;
  pointer-events:none;
  z-index:0;
  font-size:clamp(18px,3vw,32px); /* Responsive size: min 18px, max 32px */
  animation:floatAround linear infinite;
  opacity:.1;              /* Very faint so they don't distract */
  will-change:transform;   /* Tells browser to GPU-accelerate this */
}
@keyframes floatAround{
  0%  {transform:translateY(100vh) rotate(0deg)}   /* Starts below screen */
  100%{transform:translateY(-120px) rotate(720deg)} /* Ends above screen, rotated twice */
}


/* ════════════════════════════════════════════════════════════
   6. SCREEN SYSTEM
   The app has multiple "screens" (home, mode-select, game).
   Only one is visible at a time.
   - display:none hides all screens by default
   - Adding class "active" shows that screen (display:flex)
   - Adding class "screen-enter" plays the entrance animation
   ════════════════════════════════════════════════════════════ */
.screen{
  display:none;            /* Hidden by default */
  min-height:100vh;
  position:relative;
  z-index:1;               /* Above background decorations */
}
.screen.active{
  display:flex;            /* Shown when JS adds 'active' class */
  flex-direction:column;
}
/* Entrance animation — screen scales up from 94% and fades in */
.screen-enter{animation:screenIn .4s var(--ease) both}
@keyframes screenIn{
  0%  {opacity:0;transform:scale(.94) translateY(20px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}


/* ════════════════════════════════════════════════════════════
   7. HOME SCREEN
   ════════════════════════════════════════════════════════════ */
#home{
  align-items:center;
  justify-content:flex-start; /* Content starts from the top */
  padding:0;
}

/* ── Hero Banner (the orange top section with logo) ── */
.home-hero{
  width:100%;
  /* Animated gradient — background-position shifts over time */
  background:linear-gradient(135deg,var(--o),#FF4500);
  padding:44px 24px 76px;  /* Extra bottom padding for the card overlap effect */
  text-align:center;
  position:relative;       /* Needed for ::before/::after pseudo bubbles */
  overflow:hidden;
  background-size:200% 200%; /* Larger than element so position shift is visible */
  animation:heroGrad 4s ease infinite;
}
@keyframes heroGrad{
  0%,100%{background-position:0% 50%}
  50%    {background-position:100% 50%} /* Shifts the gradient left-right */
}

/* Two decorative circles behind the hero content */
.home-hero::before{
  content:'';
  position:absolute;
  top:-60px;right:-60px;   /* Positioned top-right, partially hidden */
  width:250px;height:250px;
  background:#ffffff14;    /* Semi-transparent white */
  border-radius:50%;
  animation:heroBubble1 6s ease-in-out infinite;
}
.home-hero::after{
  content:'';
  position:absolute;
  bottom:-80px;left:-30px; /* Positioned bottom-left */
  width:200px;height:200px;
  background:#ffd00026;
  border-radius:50%;
  animation:heroBubble2 5s ease-in-out infinite;
}
/* Bubbles gently scale and drift for a living background effect */
@keyframes heroBubble1{0%,100%{transform:scale(1)}50%{transform:scale(1.15) translate(10px,-15px)}}
@keyframes heroBubble2{0%,100%{transform:scale(1)}50%{transform:scale(1.2) translate(-10px,10px)}}

/* ── Logo Badge — small yellow pill above logo ── */
.logo-badge{
  display:inline-block;
  background:var(--y);
  color:var(--od);
  font-family:var(--ff);
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  padding:6px 16px;
  border-radius:50px;      /* Pill shape */
  margin-bottom:16px;
  /* Two animations chained: pops in on load, then bounces forever */
  animation:badgePop .5s var(--ease) both, badgeBounce 3s ease-in-out 1s infinite;
}
@keyframes badgePop{
  0%  {transform:scale(0);opacity:0} /* Starts invisible and tiny */
  100%{transform:scale(1);opacity:1}
}
@keyframes badgeBounce{
  0%,100%{transform:scale(1) rotate(-1deg)}
  50%    {transform:scale(1.05) rotate(1deg)} /* Gentle rock back and forth */
}

/* ── Main Logo Text ── */
.logo-mark{
  font-family:var(--ff);
  font-size:clamp(52px,11vw,90px); /* Fluid: 52px min, 90px max */
  color:#fff;
  letter-spacing:2px;
  line-height:1;
  text-shadow:4px 6px 0 #0000003d; /* Hard offset shadow for game-like look */
  animation:logoSlide .6s var(--ease) .1s both; /* .1s delay so badge animates first */
  display:inline-block;
  transition:transform .2s;
}
.logo-mark:hover{transform:scale(1.04) rotate(-1deg)} /* Slight tilt on hover */
@keyframes logoSlide{
  0%  {transform:translateY(30px);opacity:0} /* Slides up from below */
  100%{transform:translateY(0);opacity:1}
}

/* ── Tagline under logo ── */
.logo-tagline{
  font-size:14px;
  color:#ffffffd9;  /* White at 85% opacity */
  font-weight:700;
  margin-top:8px;
  letter-spacing:.5px;
  animation:fadeUp .7s .3s both; /* .3s delay — appears after logo */
}
/* Small version tag pill */
.version-tag{
  display:inline-block;
  background:#ffffff33; /* Semi-transparent white */
  color:#fff;
  font-family:var(--fm);
  font-size:9px;
  padding:2px 8px;
  border-radius:50px;
  margin-top:6px;
  letter-spacing:2px;
}
/* Reusable fade-up animation */
@keyframes fadeUp{
  0%  {opacity:0;transform:translateY(10px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── Home Content Area (below the hero) ── */
.home-content{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:0 20px 40px;
  transform:translateY(-28px); /* Pulls content up to overlap with hero bottom */
}

/* ── Daily Challenge Card ── */
.daily-card{
  background:linear-gradient(135deg,var(--y),#FFB300); /* Yellow gradient */
  border-radius:var(--rad);
  padding:20px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:all .3s var(--ease);
  box-shadow:var(--sy);    /* Yellow glow shadow */
  margin-bottom:24px;
  border:3px solid #ffffff80; /* Semi-white border for depth */
  position:relative;
  overflow:hidden;
}
/* Shiny diagonal stripe on the right side of the card */
.daily-card::after{
  content:'';
  position:absolute;
  top:0;right:0;bottom:0;
  width:80px;
  background:#ffffff2e;
  transform:skewX(-15deg) translateX(20px); /* Diagonal slant */
  transition:width .3s;
}
/* On hover: card lifts up and the shiny stripe grows */
.daily-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 48px #ffd0008c}
.daily-card:hover::after{width:120px}

/* Animated emoji icon inside daily card */
.daily-icon{
  font-size:40px;
  flex-shrink:0; /* Won't shrink when space is tight */
  animation:wobble 2s ease-in-out infinite;
}
@keyframes wobble{
  0%,100%{transform:rotate(-8deg)}
  50%    {transform:rotate(8deg)} /* Rocks left and right */
}

.daily-text h3{font-family:var(--ff);font-size:22px;color:var(--od)}
.daily-text p{font-size:13px;color:var(--od);opacity:.8;font-weight:700}

/* Arrow circle on the right of daily card */
.daily-arrow{
  margin-left:auto;  /* Pushes arrow to the far right */
  background:#fff;
  color:var(--o);
  width:40px;height:40px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;
  flex-shrink:0;
  transition:transform .3s var(--ease);
}
.daily-card:hover .daily-arrow{transform:translateX(5px) scale(1.15)} /* Arrow moves right on hover */

/* ── Section Label with decorative line ── */
.section-label{
  font-family:var(--ff);
  font-size:18px;
  color:var(--g6);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
/* ::after draws the horizontal line that extends to the right */
.section-label::after{
  content:'';
  flex:1;          /* Takes all remaining space */
  height:2px;
  background:var(--g2);
  border-radius:2px;
}

/* ── Topic Grid — cards for each quiz category ── */
.topic-grid{
  display:grid;
  /* auto-fit: creates as many columns as fit; minmax: each min 160px, max 1 fraction */
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.topic-card{
  background:#fff;
  border:2.5px solid var(--g2);
  border-radius:var(--rad);
  padding:20px 16px;
  transition:all .3s var(--ease);
  position:relative;
  overflow:hidden;   /* Hides the growing circle that spills outside */
  box-shadow:var(--sm);
}
/* The growing background blob — starts small at bottom-right */
.topic-card::before{
  content:'';
  position:absolute;
  bottom:-20px;right:-20px;
  width:80px;height:80px;
  background:var(--cb,var(--g1)); /* --cb is set per-card; fallback is gray */
  border-radius:50%;
  transition:all .4s var(--ease);
}
/* On hover: border changes color, card lifts, and blob grows to fill card */
.topic-card:hover{
  border-color:var(--cc);         /* --cc = card color, set below */
  transform:translateY(-8px) scale(1.02);
  box-shadow:var(--cs);           /* --cs = card shadow color */
}
.topic-card:hover::before{width:220px;height:220px;bottom:-60px;right:-60px}

/* ── Per-topic color overrides using CSS custom properties ── */
/* Each topic card sets its own --cc (color), --cs (shadow), --cb (blob) */
.topic-card[data-topic="gk"]     {--cc:var(--o);--cs:var(--so);--cb:var(--ol)}
.topic-card[data-topic="history"]{--cc:var(--r);--cs:0 6px 24px #e8002d4d;--cb:var(--rl)}
.topic-card[data-topic="sports"] {--cc:#008C8C;--cs:0 6px 24px #008c8c4d;--cb:#E5F5F5}
.topic-card[data-topic="science"]{--cc:var(--b);--cs:0 6px 24px #005fbf4d;--cb:var(--bl)}
.topic-card[data-topic="campus"] {--cc:var(--y);--cs:var(--sy);--cb:var(--yl)}

/* Topic card icon that rotates on hover */
.topic-icon{
  font-size:34px;
  display:block;
  margin-bottom:8px;
  transition:transform .3s var(--ease);
}
.topic-card:hover .topic-icon{transform:scale(1.25) rotate(8deg)}

/* Small question-count badge in top-right corner */
.topic-count{
  position:absolute;
  top:12px;right:12px;
  background:var(--g1);
  color:var(--g6);
  font-family:var(--fm);
  font-size:9px;font-weight:700;
  padding:2px 7px;
  border-radius:50px;
}

.topic-name{
  font-family:var(--ff);font-size:16px;color:var(--g8);
  margin-bottom:2px;
  transition:color .2s;
}
.topic-card:hover .topic-name{color:var(--cc)} /* Name turns to topic color on hover */
.topic-desc{font-size:11px;color:var(--g4);font-weight:700}

/* ── Home action buttons row ── */
.home-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}


/* ════════════════════════════════════════════════════════════
   8. SHARED BUTTONS
   ════════════════════════════════════════════════════════════ */

/* Ghost button — white background, border, turns orange on hover */
.btn-ghost{
  background:#fff;
  border:2px solid var(--g2);
  border-radius:var(--rsm);
  padding:10px 20px;
  color:var(--g6);
  font-family:var(--fn);font-weight:800;font-size:13px;
  transition:all .25s var(--ease);
  box-shadow:var(--sm);
  position:relative;
  overflow:hidden;
}
.btn-ghost:hover{border-color:var(--o);color:var(--o);transform:translateY(-3px) scale(1.04);box-shadow:var(--so)}

/* ── Primary Button — orange gradient, shared by 3 elements ── */
/* All three share the same base styles via comma-separated selector */
.btn-primary,.submit-btn,.custom-start{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--o),var(--od));
  border:none;
  border-radius:var(--rsm);
  color:#fff;
  font-family:var(--ff);
  transition:all .25s var(--ease);
  /* Two shadows stacked: a hard bottom (pressed look) + a glow */
  box-shadow:0 4px 0 var(--od),var(--so);
}
.btn-primary,.custom-start{padding:12px 24px;font-size:16px}
.submit-btn{width:100%;max-width:var(--cw);padding:14px;font-size:18px;letter-spacing:1px}

/* Shimmer effect — a diagonal light streak that sweeps across */
.btn-primary::before,.submit-btn::before,.custom-start::before{
  content:'';
  position:absolute;
  top:-50%;left:-60%;
  width:40%;height:200%;
  background:#ffffff40; /* Semi-transparent white stripe */
  transform:skewX(-20deg); /* Diagonal angle */
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{
  0%  {left:-60%}   /* Starts off the left edge */
  100%{left:150%}   /* Exits off the right edge */
}

/* Hover/active states — card lifts up / presses down */
.btn-primary:hover,.custom-start:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--od),var(--so)}
.btn-primary:active,.custom-start:active{transform:translateY(2px);box-shadow:0 2px 0 var(--od)}
.submit-btn:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 8px 0 var(--od),var(--so)}
.submit-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--od)}
/* Disabled state — grayed out, no shimmer */
.submit-btn:disabled{background:var(--g2);color:var(--g4);box-shadow:0 4px 0 var(--g2)}
.submit-btn:disabled::before{display:none}


/* ════════════════════════════════════════════════════════════
   9. MODE SELECT SCREEN
   ════════════════════════════════════════════════════════════ */
#mode-select{
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.mode-header{text-align:center;margin-bottom:28px;animation:fadeUp .5s both}
.mode-header h2{font-family:var(--ff);font-size:clamp(30px,6vw,52px);color:var(--g8)}
.mode-header p{font-size:14px;color:var(--g4);font-weight:700;margin-top:6px}

.modes-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  max-width:640px;width:100%;
}

/* Mode selection cards */
.mode-card{
  background:#fff;
  border:2.5px solid var(--g2);
  border-radius:var(--rad);
  padding:20px 16px;
  transition:all .3s var(--ease);
  text-align:center;
  position:relative;
  box-shadow:var(--sm);
  overflow:hidden;
}
/* Subtle radial glow behind card content */
.mode-card::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 120%,var(--mc,var(--g1)) 0%,transparent 70%);
  opacity:0;
  transition:opacity .3s;
}
.mode-card:hover{border-color:var(--mc);transform:translateY(-8px) scale(1.03);box-shadow:var(--ms)}
.mode-card:hover::before{opacity:.14} /* Glow fades in on hover */

/* Per-mode color tokens */
.mode-card[data-mode="classic"]{--mc:var(--g);--ms:0 8px 30px #00b3414d}
.mode-card[data-mode="custom"] {--mc:var(--y);--ms:var(--sy)
